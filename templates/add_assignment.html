<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Assignment — Student Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FBF3E7;
    --paper-card: #FFFFFF;
    --burgundy: #6B1E3C;
    --burgundy-deep: #4A1633;
    --ink-text: #2E1620;
    --muted: #9C8089;
    --radius: 14px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink-text);
    font-family: 'Inter', sans-serif;
    padding: 48px;
    min-height: 100vh;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--burgundy);
    margin-bottom: 8px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    color: var(--burgundy-deep);
    margin-bottom: 28px;
  }
  form{
    background: var(--paper-card);
    max-width: 460px;
    padding: 28px;
    border-radius: var(--radius);
    border: 1px solid rgba(107,30,60,0.08);
    box-shadow: 0 4px 14px rgba(74,22,51,0.07);
    display:flex;
    flex-direction: column;
    gap: 16px;
  }
  label{
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    margin-bottom: 4px;
    display:block;
  }
  input, select{
    width: 100%;
    padding: 9px 12px;
    border: 1px solid rgba(107,30,60,0.15);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink-text);
    background: var(--paper);
  }
  input:focus, select:focus{
    outline: none;
    border-color: var(--burgundy);
  }
  button{
    margin-top: 8px;
    background: var(--burgundy);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover{ background: var(--burgundy-deep); }
</style>
</head>
<body>

  <div class="eyebrow">Fall 2026</div>
  <h1>Add Assignment</h1>

  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <p style="color: var(--burgundy); font-size: 12px; margin-top: 4px;">{{ field.errors }}</p>
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit">Add Assignment</button>
  </form>

</body>
</html>
