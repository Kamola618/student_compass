{% extends 'base.html' %}
{% block title %}Delete task — Student Compass{% endblock %}
{% block content %}

<div class="page-head"><div><h1>Delete task</h1></div></div>

<div class="card" style="max-width:520px">
  <p>Delete <strong>{{ task.title }}</strong>? This can't be undone.</p>
  <form method="post" style="margin-top:var(--s4)">{% csrf_token %}
    <div class="row">
      <button class="btn danger" type="submit">Delete</button>
      <a class="btn ghost" href="{% url 'tasks' %}">Keep it</a>
    </div>
  </form>
</div>

{% endblock %}
